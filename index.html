<!DOCTYPE html>
<html lang="id" data-theme="deep">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040a1f">
<meta name="description" content="NauMovie · Bioskop Naura">
<title>NauMovie</title>
<link rel="icon" type="image/png" href="img/chick.png">
<link rel="apple-touch-icon" href="img/chick.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/flat.css">
<script>
/* set tema lebih awal biar tidak kedip */
(function () {
  var t = localStorage.nm_theme;
  document.documentElement.dataset.theme = ['noir','matcha','lemon','lilac','peach'].indexOf(t) > -1 ? t : 'deep';
  if (localStorage.nm_fx === '0') document.documentElement.classList.add('nofx');
})();
</script>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<div class="beam"></div>
<div class="grain"></div>
<canvas id="fx"></canvas>
<div id="spot"></div>

<div id="app"></div>

<canvas id="fx2"></canvas>
<div id="toast" class="toast"></div>

<div id="splash">
  <img src="img/logo.png" alt="NauMovie">
  <div class="sbar"><i></i></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1.26.0/index.js"></script>
<script src="js/fx.js"></script>
<script src="js/avatars.js"></script>
<script src="js/app.js"></script>
</body>
</html>
